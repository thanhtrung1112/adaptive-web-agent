<h1>Ticket TCK-2002</h1>
<p>Đơn hàng: <a href="/orders/ORD-1003">ORD-1003</a></p>
<p>Tiêu đề: Yêu cầu hoàn tiền</p><p>Trạng thái: in_progress</p>
<p>Người xử lý: Nguyễn Mai Lan</p><p>Ghi chú: </p>


<!-- Gán nhân viên và đóng ticket là hai hành động độc lập. -->
<form method="post" action="/tickets/TCK-2002/assign">
<label for="ticket-assignee">Người xử lý</label>
<select id="ticket-assignee" name="assignee_id" required=""><option value="">Chọn nhân viên</option>
<option value="1">Hoàng Quang Huy</option><option value="2" selected="">Nguyễn Mai Lan</option></select>
<button id="assign-ticket" type="submit">Gán</button></form>
<form method="post" action="/tickets/TCK-2002/close">
<label for="ticket-note">Ghi chú</label><textarea id="ticket-note" name="note" maxlength="2000" required=""></textarea>
<p><button id="close-ticket" type="submit">Đóng ticket</button></p></form>

<p><a href="/tickets">Về danh sách ticket</a></p>
