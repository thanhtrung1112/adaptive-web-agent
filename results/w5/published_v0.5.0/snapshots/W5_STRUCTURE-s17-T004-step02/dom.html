<!-- Form gửi các cặp sku/qty; thêm dòng bằng JavaScript bên dưới. -->
<h1>Tạo đơn hàng</h1>


<form method="post" action="/orders/new">
    <span style="display:contents"><span style="display:contents"><label for="order-customer">Khách hàng</label></span></span>
    <span style="display:contents"><span style="display:contents"><select id="order-customer" name="customer_id" required="">
        <option value="">Chọn khách hàng</option>
        
        <option value="1">Trần Hoa — tran.hoa@example.com</option>
        
        <option value="2">Nguyễn Văn Dũng — nguyen.dung@example.com</option>
        
        <option value="3">Phạm Thu Hà — pham.ha@example.com</option>
        
        <option value="4">Võ Thanh Tâm — vo.tam@example.com</option>
        
    </select></span></span>
    <div id="order-lines">
        
        <fieldset class="order-line">
            <legend>Sản phẩm 1</legend>
            <span style="display:contents"><span style="display:contents"><label for="order-sku-1">Sản phẩm</label></span></span>
            <span style="display:contents"><span style="display:contents"><select id="order-sku-1" name="sku" required="">
                <option value="">Chọn sản phẩm</option>
                
                <option value="SKU-100">SKU-100 — Bàn phím</option>
                
                <option value="SKU-205">SKU-205 — Chuột máy tính</option>
                
            </select></span></span>
            <span style="display:contents"><span style="display:contents"><label for="order-qty-1">Số lượng</label></span></span>
            <span style="display:contents"><span style="display:contents"><input id="order-qty-1" name="qty" type="number" min="1" max="1000000" step="1" value="1" required=""></span></span>
            <span style="display:contents"><span style="display:contents"><button type="button" class="remove-line" disabled="">Xóa dòng</button></span></span>
        </fieldset>
        
    </div>
    <p><span style="display:contents"><span style="display:contents"><button id="add-order-line" type="button">Thêm dòng</button></span></span></p>
    <span style="display:contents"><span style="display:contents"><button id="save-order" type="submit">Xác nhận tạo đơn</button></span></span>
    <span style="display:contents"><span style="display:contents"><a href="/orders">Hủy</a></span></span>
</form>
